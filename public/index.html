<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--card:#f3f4f6;--acc:#2563eb;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--fg:#e8e8ea;--mut:#9ca3af;--card:#1c1e22;--acc:#60a5fa;--bd:#2a2d33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center}
header b{flex:1}button{font:inherit;cursor:pointer}
#log{flex:1;overflow:auto;padding:16px;max-width:760px;width:100%;margin:0 auto}
.m{margin:0 0 18px}.u{background:var(--card);padding:8px 12px;border-radius:12px;margin-left:auto;width:fit-content;max-width:85%;white-space:pre-wrap}
.a a{color:var(--acc)}.a table{border-collapse:collapse}.a td,.a th{border:1px solid var(--bd);padding:4px 8px}
.st{color:var(--mut);font-size:13px;margin-bottom:6px}.src{color:var(--mut);font-size:12px;margin-top:6px}
form{display:flex;gap:8px;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
form button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:0 18px}
header button{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:8px;padding:4px 10px}
</style></head><body>
<header><b>Chat agent</b><select id="sess"></select><button id="new">New chat</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Ask anything… (Enter to send)" autofocus></textarea><button>Send</button></form>
<script>
const $=s=>document.querySelector(s);
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let uid=lsGet('uid')||crypto.randomUUID();lsSet('uid',uid);
let sid=lsGet('sid')||crypto.randomUUID();
const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
const md=t=>DOMPurify.sanitize(marked.parse(t,{breaks:true}),{ADD_ATTR:['target']}).replace(/<a /g,'<a target="_blank" rel="noopener" ');
const log=$('#log');
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.append(d);log.scrollTop=1e9;return d}
async function loadSessions(){const s=await (await fetch(`/api/sessions?userId=${uid}`)).json();
  $('#sess').innerHTML=`<option value="${sid}">Current</option>`+s.filter(x=>x.id!==sid).map(x=>`<option value="${x.id}">${new Date(x.ts).toLocaleDateString()} · ${x.title.replace(/</g,'&lt;')}</option>`).join('');$('#sess').value=sid}
async function open(id){sid=id;lsSet('sid',id);log.innerHTML='';
  const h=await (await fetch(`/api/history?userId=${uid}&sessionId=${id}`)).json();
  h.forEach(t=>t.role==='user'?add('u',t.text.replace(/</g,'&lt;')):add('a',md(t.text)));}
$('#sess').onchange=e=>open(e.target.value);
$('#new').onclick=()=>{sid=crypto.randomUUID();lsSet('sid',sid);log.innerHTML='';loadSessions()};
let busy=false;
async function send(text){
  busy=true;add('u',text.replace(/</g,'&lt;'));
  const box=add('a','');const st=document.createElement('div');st.className='st';st.textContent='Thinking…';box.append(st);
  const body=document.createElement('div');box.append(body);const srcs=document.createElement('div');srcs.className='src';box.append(srcs);
  let acc='',all=[];
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:uid,sessionId:sid,message:text,tz})});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+2);if(!line.startsWith('data: '))continue;
        const e=JSON.parse(line.slice(6));
        if(e.type==='text'){st.remove();acc+=e.delta;body.innerHTML=md(acc)}
        else if(e.type==='search'){st.textContent='Searching: '+e.queries.join(' · ')+(e.since?` (since ${e.since})`:'')}
        else if(e.type==='sources'){all.push(...e.sources)}
        else if(e.type==='error'){body.innerHTML='<i>Error: '+e.message.replace(/</g,'&lt;')+'</i>'}
        log.scrollTop=1e9}}
  }catch(err){body.textContent='Connection error.'}
  st.remove();
  if(all.length)srcs.innerHTML='Searched: '+[...new Map(all.map(s=>[s.url,s])).values()].slice(0,6).map(s=>{try{return `<a href="${s.url}" target="_blank" rel="noopener">${new URL(s.url).hostname.replace('www.','')}</a>`}catch{return ''}}).join(' · ');
  busy=false;loadSessions();
}
$('#f').onsubmit=e=>{e.preventDefault();const t=$('#q').value.trim();if(!t||busy)return;$('#q').value='';send(t)};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit()}};
open(sid).then(loadSessions);
</script></body></html>
